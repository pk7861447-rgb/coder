    .toggle-btn { background: #17a2b8; color: white; }
    .delete-btn { background: #dc3545; color: white; }
  </style>
</head>
<body>

  <!-- Theme Selector -->
  <div class="theme-selector">
    <label for="bgSelect">Theme:</label>
    <select id="bgSelect">
      <option value="blue">Deep Blue</option>
      <option value="forest">Forest Green</option>
      <option value="sunset">Sunset Orange</option>
    </select>
  </div>

  <!-- Main Todo Card -->
  <div class="todo-card">
    <h1>My To-Do List</h1>

    <form id="todoForm">
      <input type="text" id="todoInput" placeholder="Enter task name..." required>
      <button type="submit" id="addBtn">Add</button>
    </form>

    <ul id="todoList"></ul>
  </div>

  <!-- Combined JavaScript -->
  <script>
    let todos = [];

    // Background themes using fallback colors (prevents missing image bugs)
    const themes = {
      blue: "linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)",
      forest: "linear-gradient(135deg, #11998e 0%, #38ef7d 100%)",
      sunset: "linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%)"
    };

    const bgSelect = document.querySelector("#bgSelect");
    const todoForm = document.querySelector("#todoForm");
    const todoInput = document.querySelector("#todoInput");
    const todoList = document.querySelector("#todoList");

    // 1. Change Background Theme
    bgSelect.addEventListener("change", (e) => {
      document.body.style.background = themes[e.target.value];
    });

    // 2. Add New Task
    todoForm.addEventListener("submit", (e) => {
      e.preventDefault();

      const text = todoInput.value.trim();
      if (!text) return;

      const newTodo = {
        id: Date.now(),
        text: text,
        isCompleted: false
      };

      todos.push(newTodo);
      todoInput.value = "";
      renderTodos();
    });

    // 3. Delete / Toggle Tasks (Event Delegation)
    todoList.addEventListener("click", (e) => {
      const li = e.target.closest("li");
      if (!li) return;

      const id = Number(li.dataset.id);

      if (e.target.classList.contains("delete-btn")) {
        todos = todos.filter(todo => todo.id !== id);
        renderTodos();
      }

      if (e.target.classList.contains("toggle-btn")) {
        todos = todos.map(todo => {
          if (todo.id === id) {
            return { ...todo, isCompleted: !todo.isCompleted };
          }
          return todo;
        });
        renderTodos();
      }
    });

    // 4. Render Array to DOM
    function renderTodos() {
      todoList.innerHTML = "";

      todos.forEach(todo => {
        const li = document.createElement("li");
        li.dataset.id = todo.id;
        li.className = `todo-item ${todo.isCompleted ? "completed" : ""}`;

        li.innerHTML = `
          <span>${todo.text}</span>
          <div class="actions">
            <button class="toggle-btn">${todo.isCompleted ? "↩" : "✓"}</button>
            <button class="delete-btn">✕</button>
          </div>
        `;

        todoList.appendChild(li);
      });
    }
  </script>
</body>
</html> -->
