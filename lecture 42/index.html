<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nature To-Do App</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet Connection -->
  <link rel="stylesheet" href="style.css">

  <!-- JavaScript Connection with defer -->
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Theme Selector Controls -->
  <div class="theme-selector">
    <label for="bgSelect">Select Background:</label>
    <select id="bgSelect">
      <option value="forest">🌲 Forest & Lake</option>
      <option value="mountains">🏔️ Mountain Peak</option>
      <option value="ocean">🌅 Ocean Sunset</option>
      <option value="aurora">🌌 Northern Lights</option>
    </select>
  </div>

  <!-- Main Todo Card Container -->
  <div class="todo-card">
    <h1>Nature Tasks</h1>

    <form id="todoForm">
      <input type="text" id="todoInput" placeholder="Add a new task..." autocomplete="off" required>
      <button type="submit" id="addBtn">Add</button>
    </form>

    <ul id="todoList"></ul>
  </div>

</body>
</html>
